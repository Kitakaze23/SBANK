<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Отраслевой банк — Бизнес-помощник</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= Tokens ================= */
.app{
 --app:#000;--surf:#fff;--surf2:#F2F3F5;--ink:#1F1F22;--ink2:#3A3B40;--mut:#8A8D93;--line:#ECEDF0;
 --chip:#fff;--chip-ink:#2B2C30;--chip-sh:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.06);
 --acc:#1A9E95;--acc-d:#13857D;--acc-s:#E2F4F1;--acc-ink:#0E6F68;
 --w:#F4F5F7;--ubub:#E3F4F1;--uink:#0F3F3B;--in:#fff;--in-sh:0 1px 3px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.06);
 --bad:#E0353B;--ok:#1FAF84;--warn:#F07A12;
 --pbg:linear-gradient(180deg,#EEEFF2 0%,#E5E7EB 100%);--glass:rgba(255,255,255,.66);--glass-b:rgba(255,255,255,.9);--tile:#fff;
 --sheet:#fff;--ov:rgba(10,10,12,.45);
}
.app[data-theme=dark]{
 --surf:#262628;--surf2:#333336;--ink:#F2F2F4;--ink2:#D6D7DA;--mut:#9A9CA2;--line:#38383C;
 --chip:#333336;--chip-ink:#fff;--chip-sh:none;
 --acc:#2BB5AB;--acc-d:#239C93;--acc-s:#1D3A38;--acc-ink:#7FE0D6;
 --w:#313134;--ubub:#1E3E3B;--uink:#E6FFFB;--in:#333336;--in-sh:none;
 --pbg:linear-gradient(180deg,#1E1E20 0%,#161618 100%);--glass:rgba(44,44,48,.72);--glass-b:rgba(255,255,255,.06);--tile:#2E2E31;
 --sheet:#262628;--ov:rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#373B45;font:400 15px/1.4 Onest,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:10px}

/* ================= Device ================= */
.app{position:relative;height:100dvh;width:100%;background:var(--app);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;--top:max(env(safe-area-inset-top,0px),10px)}
.sb{display:none}
@media(min-width:520px){
 .app.app{position:absolute;left:50%;top:50%;width:390px;height:844px;border-radius:52px;transform:translate(-50%,-50%) scale(var(--k,1));box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 90px -30px rgba(0,0,0,.6);--top:44px}
 .sb{display:flex;position:absolute;top:0;left:0;right:0;height:44px;padding:15px 30px 0;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;z-index:30;pointer-events:none;color:var(--ink)}
 .sb.lt{color:#fff}
}
#view{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}

/* ================= Home: header ================= */
.top{background:var(--surf);border-radius:0 0 28px 28px;padding:calc(var(--top) + 8px) 0 10px;position:relative;z-index:3}
.hrow{display:flex;align-items:center;gap:6px;padding:0 14px 0 12px}
.ib{width:40px;height:40px;display:grid;place-items:center;color:var(--acc);border-radius:12px;position:relative}
.ib svg{width:24px;height:24px}
.ib .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#FF7A1A;border:2px solid var(--surf)}
.org{display:flex;align-items:center;gap:4px;font-weight:600;font-size:17px;flex:1;min-width:0;padding:6px 4px}
.org span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org svg{width:18px;height:18px;color:var(--mut)}
.accs{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:8px 14px 4px;scroll-padding:0 14px}
.accs::-webkit-scrollbar{display:none}
.qrt{flex:none;width:46px;border-radius:16px;background:var(--surf2);display:grid;place-items:center;color:var(--acc);scroll-snap-align:start}
.qrt svg{width:26px;height:26px}
.acc{flex:none;width:calc(100% - 66px);min-height:82px;border-radius:16px;background:var(--surf2);padding:14px 14px 12px 16px;display:flex;gap:10px;align-items:center;scroll-snap-align:start;text-align:left}
.acc .l{flex:1;min-width:0}
.acc .bal{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;white-space:nowrap}
.acc .bal i{display:block;width:26px;height:17px;border-radius:4px;background:linear-gradient(135deg,#d9dbe0,#f4f5f7 45%,#c9ccd2);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08);flex:none}
.acc .bal i.pg{background:linear-gradient(135deg,#7FE0C4,#1A9E95)}
.acc .bal i.cd{background:linear-gradient(135deg,#3A3B40,#6b6d74)}
.acc .sub{font-size:13px;color:var(--mut);margin-top:4px}
.acc .fig{font-size:10.5px;text-align:right;line-height:1.45;color:var(--mut);white-space:nowrap}
.acc .fig .in{color:var(--acc)}
.acc .fig .o{color:var(--ink2)}
.dots{display:flex;gap:4px;justify-content:center;margin-top:8px}
.dots i{width:4px;height:4px;border-radius:4px;background:var(--line);transition:.2s}
.app[data-theme=dark] .dots i{background:#4a4a4e}
.dots i.on{width:14px;background:var(--mut)}

/* ================= Status strip ================= */
.strip{margin-top:-28px;padding:36px 14px 10px;position:relative;z-index:2;color:#fff}
.strip.orange{background:linear-gradient(90deg,#FF8A24,#F7621A 60%,#E9500F)}
.strip.green{background:linear-gradient(90deg,#08C07B,#06B07C 60%,#0A8C7A);padding:34px 14px 8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;position:relative}
.strip.green .x{position:absolute;right:14px;bottom:6px;width:24px;height:24px;display:grid;place-items:center;opacity:.8}
.strip.green .x svg{width:14px;height:14px}
.tasks{display:flex;gap:8px}
.tasks button{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;background:rgba(255,255,255,.18);border-radius:12px;padding:7px 8px 7px 10px;font-size:12px;line-height:1.25;color:#fff;transition:background .15s}
.tasks button:hover{background:rgba(255,255,255,.26)}
.tasks b{font-weight:600;font-size:11px;background:rgba(255,255,255,.25);border-radius:8px;padding:3px 6px;white-space:nowrap}

/* ================= Chat card ================= */
.chat{flex:1;min-height:0;margin-top:8px;background:var(--surf);border-radius:28px 28px 0 0;display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:520px){.chat{border-radius:28px 28px 52px 52px}}
.chat .menu{position:absolute;top:10px;right:12px;z-index:4;width:36px;height:36px;border-radius:12px;background:var(--surf);display:grid;place-items:center;color:var(--acc)}
.app[data-theme=dark] .chat .menu{background:#3a3b3e}
.chat .menu svg{width:22px;height:22px}
.feed{flex:1;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;display:flex;flex-direction:column}
.feed::-webkit-scrollbar{display:none}
.hello{margin:auto 0;padding:40px 0 20px;text-align:center}
.hello h1{font-size:22px;line-height:1.32;font-weight:500;letter-spacing:-.01em;padding:0 24px}
.rows{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.mq{overflow:hidden;padding:3px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.mqt{display:flex;width:max-content;animation:mq var(--d,48s) linear infinite;will-change:transform}
.mq.rev .mqt{animation-direction:reverse}
.mqg{display:flex;gap:10px;padding-right:10px}
.mq:hover .mqt,.mq.hold .mqt,.mq:focus-within .mqt{animation-play-state:paused}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.mqt{animation:none}.mq{overflow-x:auto}}
.chip{flex:none;background:var(--chip);color:var(--chip-ink);box-shadow:var(--chip-sh);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;transition:transform .1s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink2);color:var(--surf)}
.msgs{display:flex;flex-direction:column;gap:14px;padding:56px 14px 12px}
.feed{mask-image:linear-gradient(transparent 0,#000 52px);-webkit-mask-image:linear-gradient(transparent 0,#000 52px)}
.m{max-width:100%}
.m.u{align-self:flex-end;max-width:82%;background:var(--ubub);color:var(--uink);border-radius:18px 18px 6px 18px;padding:10px 14px;font-size:15px}
.m.b{align-self:stretch;display:flex;gap:10px}
.m.b .av{width:28px;height:28px;border-radius:10px;background:var(--acc-s);color:var(--acc);display:grid;place-items:center;flex:none;margin-top:1px}
.m.b .av svg{width:16px;height:16px}
.m.b .bd{flex:1;min-width:0}
.m.b .tx{font-size:15px;line-height:1.45;padding-top:3px}
.m.b .tx b{font-weight:600}
.m.b .nm{font-size:12px;color:var(--mut);margin-bottom:2px}
.typing{display:flex;gap:4px;padding:10px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.sug{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 14px 2px}
.sug::-webkit-scrollbar{display:none}
.sug .chip{padding:7px 12px;font-size:12.5px}
.inp{margin:8px 8px 0;background:var(--in);box-shadow:var(--in-sh);border-radius:18px;padding:12px 12px 10px 14px;border:1px solid var(--line)}
.app[data-theme=dark] .inp{border-color:transparent}
.inp input{width:100%;outline:0;font-size:15px;padding:0 0 8px}
.inp input::placeholder{color:var(--mut)}
.inp .ia{display:flex;align-items:center;justify-content:space-between}
.inp .clip{width:28px;height:28px;display:grid;place-items:center;color:var(--mut);margin-left:-4px}
.inp .clip svg{width:22px;height:22px}
.inp .go{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.6);transition:.15s;pointer-events:none}
.inp .go.on{opacity:1;transform:none;pointer-events:auto}
.inp .go svg{width:18px;height:18px}
.terms{text-align:center;font-size:10.5px;color:#7B6FE0;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px))}
@media(min-width:520px){.terms{padding-bottom:22px}}
.app[data-theme=dark] .terms{color:#8F85F0}

/* ================= Widgets (в чате) ================= */
.wg{background:var(--w);border-radius:18px;padding:14px;margin-top:10px}
.wg+.wg{margin-top:8px}
.wh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut);margin-bottom:6px}
.wt{font-size:17px;font-weight:600;line-height:1.25}
.wbig{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px}
.kv span{color:var(--mut)}.kv b{font-weight:500;text-align:right}
.it{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0}
.it+.it{border-top:1px solid var(--line)}
.it .cb{width:22px;height:22px;border-radius:7px;border:2px solid #C7CAD0;display:grid;place-items:center;flex:none;color:#fff}
.app[data-theme=dark] .it .cb{border-color:#5a5b60}
.it .cb.on{background:var(--acc);border-color:var(--acc)}
.it .cb svg{width:14px;height:14px}
.it .nn{flex:1;min-width:0}.it .nn b{display:block;font-weight:500;font-size:14px}.it .nn small{font-size:12.5px;color:var(--mut)}
.it .sm{font-weight:500;font-size:14px;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;border-radius:14px;background:var(--acc);color:#fff;font-weight:600;font-size:15px;text-align:center;margin-top:12px;transition:background .15s,transform .1s}
.btn svg{width:18px;height:18px}.btn:hover{background:var(--acc-d)}.btn:active{transform:scale(.98)}
.btn.gh{background:var(--surf);color:var(--acc)}
.app[data-theme=dark] .btn.gh{background:#3d3d41}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.wchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wchips .chip{padding:7px 11px;font-size:12.5px;font-weight:500;box-shadow:none;background:var(--surf)}
.app[data-theme=dark] .wchips .chip{background:#3d3d41}
.wchips .chip.on{background:var(--ink2);color:var(--surf)}
.app[data-theme=dark] .wchips .chip.on{background:#fff;color:#1f1f22}
.lbl{font-size:13px;color:var(--mut);margin-top:12px}
.rng{width:100%;margin-top:6px;accent-color:var(--acc)}
.done{display:flex;align-items:center;gap:10px;color:var(--acc-ink);background:var(--acc-s);border-radius:14px;padding:11px 12px;font-size:14px;margin-top:10px}
.done svg{width:18px;height:18px;flex:none}
.fld{display:block;margin-top:8px}
.fld span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.fld input{width:100%;background:var(--surf);border-radius:12px;padding:10px 12px;font-size:15px;outline:0;border:1px solid var(--line)}
.app[data-theme=dark] .fld input{background:#3d3d41;border-color:transparent}
.bars{display:flex;align-items:flex-end;gap:6px;height:84px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;max-width:14px;border-radius:99px;background:var(--acc);opacity:.45}
.bars div:last-child i{opacity:1}
.bars small{font-size:10.5px;color:var(--mut)}
.lev{display:flex;gap:10px;align-items:flex-start;padding:10px 0;width:100%}
.lev+.lev{border-top:1px solid var(--line)}
.lev .n{width:24px;height:24px;border-radius:8px;background:var(--acc-s);color:var(--acc);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.lev b{display:block;font-weight:500;font-size:14px}.lev small{color:var(--mut);font-size:12.5px}
.lev .e{margin-left:auto;color:var(--acc);font-weight:600;font-size:13px;white-space:nowrap}
.mgr{display:flex;gap:10px;align-items:center}
.mgr .ph{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#9BE7D8,#1A9E95);color:#fff;display:grid;place-items:center;font-weight:600}
.qrbox{width:150px;height:150px;margin:6px auto 4px;background:#fff;border-radius:14px;padding:10px}
.pc{display:flex;gap:12px}
.pc .img{width:76px;height:76px;border-radius:14px;flex:none;background:radial-gradient(circle at 35% 35%,#F7D9A6,#D9944A 60%,#A9652A)}
.pc b{font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:7px;padding:2px 7px;background:var(--acc-s);color:var(--acc-ink)}
.tag.o{background:#FFF0E2;color:#C25A00}
.app[data-theme=dark] .tag.o{background:#47321f;color:#FFB06B}
.tag.r{background:#FDE9EA;color:#C5232A}
.app[data-theme=dark] .tag.r{background:#4a2426;color:#FF8F94}

/* ================= Profile ================= */
.prof{flex:1;overflow-y:auto;scrollbar-width:none;background:var(--pbg);position:relative}
.prof::-webkit-scrollbar{display:none}
.hero{height:300px;position:relative;overflow:hidden;
 background:
 radial-gradient(60% 55% at 22% 30%,rgba(255,236,200,.95),rgba(255,236,200,0) 70%),
 radial-gradient(50% 50% at 75% 22%,rgba(226,160,86,.95),rgba(226,160,86,0) 70%),
 radial-gradient(45% 45% at 60% 70%,rgba(190,112,48,.9),rgba(190,112,48,0) 70%),
 radial-gradient(40% 40% at 15% 85%,rgba(150,84,36,.85),rgba(150,84,36,0) 70%),
 radial-gradient(35% 35% at 92% 80%,rgba(244,205,150,.9),rgba(244,205,150,0) 70%),
 linear-gradient(135deg,#C98A4B,#8C5426);background-size:cover;background-position:center}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,0) 35%)}
.hero .hb{position:absolute;top:calc(var(--top) + 6px);left:14px;right:14px;display:flex;justify-content:space-between;z-index:2}
.gb{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.45);display:grid;place-items:center;color:#1f1f22}
.gb svg{width:22px;height:22px}
.hero .cov{position:absolute;right:14px;bottom:48px;z-index:2;font-size:12px;color:#fff;background:rgba(0,0,0,.25);backdrop-filter:blur(10px);border-radius:10px;padding:6px 10px}
.pbody{margin-top:-40px;position:relative;z-index:2;padding:0 10px 28px}
.pcard{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:16px;margin-top:10px}
.pcard.first{border-radius:28px;padding-top:0;margin-top:0}
.ava{width:76px;height:76px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#C6F36B,#2BC4B3);margin-top:-38px;position:relative}
.ava div{width:100%;height:100%;border-radius:50%;background:linear-gradient(160deg,#2F4B57,#1B2B33);border:3px solid #fff;color:#fff;display:grid;place-items:center;font-weight:600;font-size:22px}
.app[data-theme=dark] .ava div{border-color:#2a2a2d}
.lvl{display:flex;align-items:center;gap:10px;justify-content:flex-end;font-size:13px;color:var(--mut);margin-top:-26px;padding-left:90px}
.lvl .bar{width:110px;height:12px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
.app[data-theme=dark] .lvl .bar{background:rgba(255,255,255,.1)}
.lvl .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C6F36B,#5FE0B5 55%,#2BC4B3)}
.pname{font-size:22px;font-weight:600;line-height:1.2;margin-top:14px}
.pgoal{font-size:14px;color:var(--mut);margin-top:6px}
.pstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.pstats b{display:block;font-size:17px;font-weight:600}
.pstats small{font-size:13px;color:var(--mut)}
.ptitle{font-size:17px;font-weight:500}
.psub{font-size:12.5px;color:var(--mut);margin-top:4px}
.trk{display:flex;gap:12px;align-items:center}
.trk .l{flex:1;min-width:0}
.trk svg.rad{width:128px;height:128px}
.sbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.06);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:500;margin-top:14px}
.app[data-theme=dark] .sbtn{background:rgba(255,255,255,.08)}
.sbtn svg{width:14px;height:14px}
.legend{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.legend button{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);width:100%}
.legend i{width:8px;height:8px;border-radius:3px;flex:none}
.legend b{margin-left:auto;color:var(--ink);font-weight:600}
.next{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.next .l{flex:1}
.next svg{width:22px;height:22px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.rt{background:var(--tile);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;min-height:150px}
.rt .h{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;font-size:13px;font-weight:600;line-height:1.3;padding-bottom:9px;border-bottom:1px solid var(--line)}
.rt .h svg{width:16px;height:16px;margin-top:1px}
.rt p{font-size:12.5px;color:var(--mut);line-height:1.4;margin-top:9px;flex:1}
.rt .tag{align-self:flex-start;margin-top:8px}
.pfoot{text-align:center;font-size:12px;color:var(--mut);padding:18px 0 6px}

/* ================= Sheet / toast ================= */
.ov{position:absolute;inset:0;background:var(--ov);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}

function wAct(m,v){const [a,x]=v.split(':');const s=m.s;
 if(a=='tog'){s.sel[+x]=s.sel[+x]?0:1}
 else if(a=='cf'){s.cf=1}else if(a=='cancel'){s.cf=0}
 else if(['p','f','o','c','t','ch'].includes(a)){s[a]=+x}
 else if(a=='a'){s.a=+x}else if(a=='l'){s.l[+x]=s.l[+x]?0:1}else if(a=='v'){s.v=s.v?0:1}else if(a=='loc'){s.loc=+x}
 else if(a=='ok'){
  if(m.w=='list'){const L=LISTS[s.k];const sel=L.all?L.items.map(()=>1):s.sel;const sum=L.items.reduce((t,it,i)=>t+(sel[i]&&it[2]?it[2]:0),0);s.done=1;s.sum=sum;save();drawAll();L.after(sel.filter(Boolean).length,sum);return}
  s.done=1;
  if(m.w=='piggy'){st.piggy=1;st.pig+=s.a;st.bal-=s.a;s.open=1;follow('Копилка открыта. Первые проценты начислю 1 декабря.',['Выписка','Вывести средства'])}
  if(m.w=='withdraw'){st.bal-=s.a;follow('Деньги уже на карте. Налоговых последствий для ИП нет.',['Выписка','Налоги'])}

  if(m.w=='credit')follow('Заявка у кредитного специалиста. Данные бизнеса уже заполнены — документы не нужны.',['План роста выручки'])
  if(m.w=='loyalty')follow('Рассылка уйдёт сегодня в 12:00. Через неделю покажу, сколько клиентов вернулось.',['Карточка товара','План роста выручки'])

  if(m.w=='salary')follow('Зарплата ушла. НДФЛ и взносы уплатим 28-го автоматически.',['Налоги','Выписка'])

  if(m.w=='statement')toast('Выписка отправлена на почту');
  if(m.w=='limits')toast('Лимиты сохранены');
  if(m.w=='pay'){st.bal-=parseInt(String(s.sum).replace(/\D/g,''))||0;st.t.bill=Math.max(0,st.t.bill-1)}
  if(m.w=='launch'){const id=s.step;st.ls[id]=1;if(id=='location')st.locName=LOCS[s.loc||0][0];
   if(id=='firstsale'){save();drawAll();setTimeout(()=>{push(BOT('🎉 Первая продажа! Теперь в профиле появится Пульс бизнеса — оценка будет уточняться по мере накопления данных.','',{}));st.stage='active';st.grad=1;lastSug=['Как дела у бизнеса?'];save();drawAll()},500);return}
   const n=nextStep();setTimeout(()=>{push(BOT(launchText(n),'launch',{step:n}));lastSug=['Как дела у бизнеса?'];save();drawFeed(true)},450)}
 }
 save();drawAll()}
function qrSvg(){let r='';const N=21;let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const f=(x<7&&y<7)||(x>N-8&&y<7)||(x<7&&y>N-8);if(f){const cx=x<7?0:N-7,cy=y<7?0:N-7,dx=x-cx,dy=y-cy;if(dx==0||dy==0||dx==6||dy==6||(dx>1&&dx<5&&dy>1&&dy<5))r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}else if(rnd()>.52)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="0 0 21 21" width="100%" height="100%" fill="#1f1f22" shape-rendering="crispEdges">${r}</svg>`}

/* ================= Radial chart (Пульс в профиле) ================= */
function radial(size=128){const cx=64,cy=64,rings=5,r0=24,rw=6.4,gap=1.6,n=METRICS.length,seg=360/n,pad=5;let p='';
 const arc=(r1,r2,a1,a2)=>{const t=a=>(a-90)*Math.PI/180,P=(r,a)=>[cx+r*Math.cos(t(a)),cy+r*Math.sin(t(a))];const [x1,y1]=P(r2,a1),[x2,y2]=P(r2,a2),[x3,y3]=P(r1,a2),[x4,y4]=P(r1,a1);const lg=a2-a1>180?1:0;return `M${x1},${y1}A${r2},${r2} 0 ${lg} 1 ${x2},${y2}L${x3},${y3}A${r1},${r1} 0 ${lg} 0 ${x4},${y4}Z`};
 METRICS.forEach((m,i)=>{const filled=Math.round(m.v/100*rings);for(let k=0;k<rings;k++){const r1=r0+k*(rw+gap),r2=r1+rw;const on=k<filled;p+=`<path d="${arc(r1,r2,i*seg+pad/2,(i+1)*seg-pad/2)}" fill="${on?m.c:'var(--line)'}" opacity="${on?(.55+.45*(k+1)/rings):1}"><title>${m.name}: ${m.v}</title></path>`}});
 return `<svg class="rad" viewBox="0 0 128 128" width="${size}" height="${size}" role="img" aria-label="Здоровье бизнеса ${SCORE} из 100">${p}<text x="64" y="69" text-anchor="middle" font-size="17" font-weight="600" fill="currentColor" font-family="Onest,sans-serif">${SCORE}</text></svg>`}
function ring(done,total){const c=2*Math.PI*48,v=done/total;return `<svg class="rad" viewBox="0 0 128 128" width="128" height="128"><circle cx="64" cy="64" r="48" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="64" cy="64" r="48" fill="none" stroke="url(#lg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 64 64)"/><defs><linearGradient id="lg"><stop offset="0" stop-color="#C6F36B"/><stop offset="1" stop-color="#2BC4B3"/></linearGradient></defs><text x="64" y="70" text-anchor="middle" font-size="19" font-weight="600" fill="currentColor" font-family="Onest,sans-serif">${done}/${total}</text></svg>`}

  <section class="pcard">${nw?`<div class="trk"><div class="l"><div class="ptitle">Готовность к старту</div><div class="psub">Пульс бизнеса появится после первых продаж — когда накопятся данные.</div><button class="sbtn" data-a="sources">${ic('download')}Загрузить данные</button></div>${ring(done,LSTEPS.length)}</div>`
   :`<div class="trk"><div class="l"><div class="ptitle">Пульс бизнеса</div><div class="psub">Здоровье бизнеса — ${SCORE} из 100, +5 за неделю</div><button class="sbtn" data-a="sources">${ic('download')}Загрузить данные</button></div><button data-a="pulse" aria-label="Подробнее о показателях">${radial()}</button></div>
   <div class="legend">${METRICS.map(m=>`<button data-a="metric" data-v="${m.id}"><i style="background:${m.c}"></i>${m.name}<b>${m.v} <span style="color:${m.d<0?'var(--bad)':'var(--acc)'};font-weight:500">${m.d>0?'+':''}${m.d}</span></b></button>`).join('')}</div>`}
  </section>
  <section class="pcard"><button class="next" data-a="tochat" data-v="${nw?'launch':'loyalty'}"><span class="l"><span style="display:flex;align-items:center;gap:8px;justify-content:space-between"><span class="ptitle">Что вам делать дальше</span><span class="tag">Рекомендуем</span></span><span class="psub" style="display:block">${nw?(ns?ns[1]+' — следующий шаг запуска.':'Все шаги пройдены.'):'Верните постоянных клиентов: повторные покупки −14%. Подключите программу лояльности.'}</span></span>${ic('chev')}</button></section>
  <section class="pcard"><div class="ptitle">Рекомендации и сервисы</div><div class="rgrid">${recs.map(r=>`<button class="rt" data-a="tochat" data-v="${r.i}"><span class="h">${r.t}${ic('chev')}</span><p>${r.p}</p><span class="tag ${r.tc||''}">${r.tag}</span></button>`).join('')}</div></section>
  <p class="pfoot">Действия по рекомендациям выполняются в чате · Демонстрационные данные</p>
 </div></div>`}

/* ================= Render ================= */
function render(){const app=document.getElementById('app');app.dataset.theme=st.theme=='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):st.theme;
 const v=st.view=='profile'?'profile':'home';
 app.innerHTML=`<div class="sb ${v=='profile'&&!st.coverDark?'lt':''}"><span>18:41</span><span style="display:flex;gap:5px;align-items:center"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx=".7"/><rect x="4.5" y="5" width="3" height="6" rx=".7"/><rect x="9" y="2.5" width="3" height="8.5" rx=".7"/><rect x="13.5" y="0" width="3" height="11" rx=".7"/></svg><svg width="24" height="11" viewBox="0 0 24 11"><rect x=".5" y=".5" width="21" height="10" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="7" rx="1.8" fill="currentColor"/></svg></span></div>
 <div id="view">${v=='home'?homeHTML():profileHTML()}</div>
 <div class="ov" id="ov" data-a="close"></div><div class="sh" id="sh" role="dialog" aria-modal="true" aria-hidden="true"></div><div class="toast" id="toast" role="status"></div>`;
 if(v=='home'){drawTop();drawStrip();drawFeed(true);const f=document.getElementById('cf'),q=document.getElementById('q'),go=document.getElementById('go');
  q.addEventListener('input',()=>go.classList.toggle('on',!!q.value.trim()));
  f.addEventListener('submit',e=>{e.preventDefault();const t=q.value.trim();if(!t)return;q.value='';go.classList.remove('on');say(t)})}}
function drawAll(){if(st.view=='profile'){render();return}drawTop();drawStrip();const f=document.getElementById('feed');const y=f?f.scrollTop:0;drawFeed();if(f)f.scrollTop=y}

/* ================= Sheets ================= */
function sheet(title,body){const sh=document.getElementById('sh');sh.innerHTML=`<div class="gr"></div><div class="shh"><h2>${title}</h2><button class="x" data-a="close" aria-label="Закрыть">${ic('close')}</button></div><div class="shb">${body}</div>`;document.getElementById('ov').classList.add('on');sh.classList.add('on');sh.setAttribute('aria-hidden','false')}
function closeSheet(){const o=document.getElementById('ov'),s=document.getElementById('sh');o&&o.classList.remove('on');s&&(s.classList.remove('on'),s.setAttribute('aria-hidden','true'))}
function toast(t){const el=document.getElementById('toast');el.innerHTML=ic('check')+t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}
const li=(ico,t,s,a,v,right='')=>`<button class="li" data-a="${a}" data-v="${esc(v||'')}"><span class="ri">${ic(ico)}</span><span class="rb"><span class="rt2"><b>${t}</b>${s?`<small>${s}</small>`:''}</span>${right||ic('chev','chev')}</span></button>`;
function toChat(text,intent,arg){closeSheet();if(st.view!='home'){st.view='home';save();render()}say(text,intent,arg)}

/* ================= Actions ================= */
const A={
 close:closeSheet,
 say:v=>toChat(v),
 tochat:v=>{const map={req:'Реквизиты',loyalty:'Лояльность клиентов',card:'Бизнес-карта',credit:'Кредит на развитие',piggy:'Открыть копилку',qrpay:'Получить оплату по QR',product:'Карточка товара',plan:'План роста выручки',report:'Финансовая отчётность',growth:'План роста выручки',launch:'Следующий шаг запуска'};toChat(map[v]||'Реквизиты',v=='growth'?'plan':v)},
 wa:(v,el)=>{const m=st.msgs.find(x=>x.id==+el.dataset.id);if(m)wAct(m,v)},
 go:v=>{closeSheet();st.view=v;save();render()},
 stripx:()=>{st.stripX=1;save();drawStrip()},
 grad:()=>{st.grad=0;save();render()},
 toast:v=>toast(v),
 terms:()=>sheet('Условия использования',`<p class="lead">Бизнес-помощник отвечает на основе данных вашего бизнеса. Платежи и документы исполняются только после вашего подтверждения. Ответы ИИ носят рекомендательный характер.</p>`),
 menu:()=>sheet('Бизнес-помощник',`${li('plus','Новый диалог','','newchat')}${li('headset','Связаться с поддержкой','Ответ в течение 2 минут','say','Поддержка')}${li('grid','Все сервисы','Банковские и для роста бизнеса','services')}${li('user','Профиль и Пульс бизнеса','','go','profile')}
  <div class="sec"><h3>История</h3>${li('history','Оплата аренды за ноябрь','Вчера','toast','История — в полной версии')}${li('history','Выписка за октябрь','2 ноября','toast','История — в полной версии')}${li('history','Открытие бизнес-карты','28 октября','toast','История — в полной версии')}</div>`),
 newchat:()=>{st.msgs=[];lastSug=null;save();closeSheet();drawFeed()},
 services:()=>sheet('Все сервисы',`<div class="sec" style="margin-top:0"><h3>Банк</h3>${[['doc','Налоги'],['doc','Счета к оплате'],['doc','На подпись'],['copy','Реквизиты'],['download','Выписка'],['trend','Открыть копилку'],['logout','Вывести средства'],['grid','Бизнес-карта'],['grid','Лимиты'],['scan','Получить оплату по QR']].map(([i,t])=>li(i,t,'','say',t)).join('')}</div><div class="sec"><h3>Рост бизнеса</h3>${[['spark','Как дела у бизнеса?'],['trend','План роста выручки'],['doc','Финансовая отчётность'],['user','Лояльность клиентов'],['store','Карточка товара'],['trend','Кредит на развитие']].map(([i,t])=>li(i,t,'','say',t)).join('')}</div>`),
 orgs:()=>sheet('Компания',ORGS.map(([n,s],i)=>li('store',n,s,i?'toast':'close',i?'Переключение компаний — в полной версии':'',i==0?`<span style="color:var(--acc)">${ic('check')}</span>`:'')).join('')+li('plus','Добавить компанию','','toast','В полной версии')),
 search:()=>{const items=[...CH1,...CH2,'Счета к оплате','На подпись','Получить оплату по QR'];sheet('Поиск',`<div class="srch">${ic('search')}<input id="sq" placeholder="Операция, сервис или вопрос" autocomplete="off"></div><div id="sr"></div>`);
  const draw=q=>{const l=items.filter(t=>t.toLowerCase().includes(q.toLowerCase())).slice(0,8);document.getElementById('sr').innerHTML=l.map(t=>li('chat',t,'','say',t)).join('')+(q&&!l.length?li('spark',`Спросить помощника: «${esc(q)}»`,'','say',q):'')};
  draw('');const i=document.getElementById('sq');i.addEventListener('input',()=>draw(i.value));i.addEventListener('keydown',e=>{if(e.key=='Enter'&&i.value.trim())toChat(i.value.trim())});setTimeout(()=>i.focus(),300)},
 notif:()=>sheet('Уведомления',[['alert','Показатель «Клиенты» снизился на 6','Вчера, 18:20','metric','clients'],['doc',`${st.t.sign} документов ждут подписи`,'Сегодня, 08:15','say','На подпись'],['doc','Налог УСН — до 28 ноября','Вчера, 10:05','say','Налоги'],['trend','Поступила оплата 48 250 ₽','Сегодня, 09:02','say','Выписка']].filter(x=>!(x[4]=='Налоги'&&!st.t.tax)&&!(x[4]=='На подпись'&&!st.t.sign)).map(([i,t,s,a,v])=>li(i,t,s,a,v)).join('')),
 scan:()=>sheet('Оплата по QR',`<div class="scan"></div><p class="lead" style="margin-top:10px;text-align:center">Наведите камеру на QR-код счёта или квитанции</p><button class="btn" data-a="scanok">Демо: распознать QR</button>`),
 scanok:()=>toChat('Оплатить по QR','pay'),
 attach:()=>toChat('Оплатить счёт из файла schet_318.pdf','pay'),
 pulse:()=>sheet('Пульс бизнеса',`<div style="display:flex;justify-content:center;color:var(--ink)">${radial(180)}</div><p class="lead" style="text-align:center;margin-top:4px">Хорошее состояние · +5 за неделю</p>${METRICS.map(m=>li('spark',`${m.name} — ${m.v}`,m.q,'metric',m.id,`<span style="color:${m.d<0?'var(--bad)':'var(--acc)'};font-weight:600">${m.d>0?'+':''}${m.d}</span>`)).join('')}`),
 metric:v=>{const m=METRICS.find(x=>x.id==v);const mx=Math.max(...m.hist),mn=Math.min(...m.hist)-5;
  sheet(m.name,`<div style="display:flex;align-items:baseline;gap:10px"><span style="font-size:40px;font-weight:600">${m.v}</span><span style="color:${m.d<0?'var(--bad)':'var(--acc)'};font-weight:600">${m.d>0?'+':''}${m.d} за неделю</span></div><div class="wt" style="margin-top:4px">${m.q}</div><div class="mbar">${m.hist.map(x=>`<i style="height:${20+80*(x-mn)/(mx-mn)}%;background:${m.c}"></i>`).join('')}</div><div class="sec"><h3>Что изменилось</h3><ul class="bul">${m.ch.map(x=>`<li>${x}</li>`).join('')}</ul></div><button class="btn" data-a="tochat" data-v="${m.intent}">Обсудить в чате</button>`)},
 sources:()=>sheet('Источники данных',`${[['Эквайринг и СБП','Подключено'],['Онлайн-касса','Подключено'],['Расчётный счёт','Подключено'],['Учётная система (1С, Excel)','Загрузить файл']].map(([t,s],i)=>li('db',t,s,i<3?'close':'toast',i<3?'':'Загрузка файла — в полной версии',i<3?`<span style="color:var(--acc)">${ic('check')}</span>`:'')).join('')}`),
 settings:()=>sheet('Настройки',`<div class="sec" style="margin-top:0"><h3>Тема</h3><div class="seg">${[['light','Светлая'],['dark','Тёмная'],['system','Как в системе']].map(([k,n])=>`<button class="${st.theme==k?'on':''}" data-a="theme" data-v="${k}">${n}</button>`).join('')}</div></div>
  <div class="sec"><h3>Уведомления</h3>${[['push','Push-уведомления'],['mail','Сводка на почту по понедельникам']].map(([k,n])=>`<button class="li" data-a="nt" data-v="${k}"><span class="rb"><span class="rt2"><b>${n}</b></span><span class="sw ${st.notif[k]?'on':''}"></span></span></button>`).join('')}</div>
  <div class="sec"><h3>Данные</h3>${li('db','Источники данных','Эквайринг, СБП, касса, счёт','sources')}${li('store','Профиль компании',ORG.kind+' · '+ORG.addr,'toast','В полной версии')}</div>
  <div class="sec"><h3>Демо: стадия бизнеса</h3><div class="seg">${[['new','Новый бизнес'],['active','Действующий']].map(([k,n])=>`<button class="${st.stage==k?'on':''}" data-a="stage" data-v="${k}">${n}</button>`).join('')}</div><p class="lead" style="font-size:12.5px;margin-top:8px">У нового бизнеса вместо Пульса — маршрут запуска. После первой продажи профиль сам переключается на Пульс.</p></div>
  <button class="btn gh" style="background:var(--w)" data-a="reset">${ic('refresh')}Сбросить демо</button>`),
 theme:v=>{st.theme=v;save();render();A.settings()},
 nt:v=>{st.notif[v]=st.notif[v]?0:1;save();A.settings()},
 stage:v=>{st.stage=v;st.grad=0;st.msgs=[];lastSug=null;if(v=='new')st.ls={};save();render();A.settings()},
 reset:()=>{const th=st.theme;st=JSON.parse(JSON.stringify(st0));st.theme=th;lastSug=null;save();render();toast('Демо сброшено')},
 logout:()=>sheet('Выйти из приложения?',`<p class="lead">В прототипе выход вернёт на главный экран.</p><div class="btns"><button class="btn gh" style="background:var(--w)" data-a="close">Отмена</button><button class="btn" data-a="go" data-v="home">Выйти</button></div>`),
 cover:()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{st.cover=r.result;render()};r.readAsDataURL(f)};i.click()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(!A[a])return;e.preventDefault();A[a](el.dataset.v,el)});
document.addEventListener('input',e=>{const el=e.target,id=+el.dataset.id;if(!el.dataset.in)return;const m=st.msgs.find(x=>x.id==id);if(!m)return;const v=+el.value,s=m.s;
 if(el.dataset.in=='pig'){s.a=v;document.getElementById('pa'+id).textContent=rub(v);document.getElementById('pi'+id).textContent='≈ '+rub(Math.round(v*.14/12))}
 if(el.dataset.in=='lc'){s.c=v;document.getElementById('lc'+id).textContent=rub(v)}
 if(el.dataset.in=='lp'){s.p=v;document.getElementById('lp'+id).textContent=rub(v)}
 if(el.dataset.in=='cr'){s.a=v;const mm=[12,24,36][s.t],r=.169/12,pay=v*r/(1-Math.pow(1+r,-mm));document.getElementById('ca'+id).textContent=rub(v);document.getElementById('cp'+id).textContent='≈ '+rub(Math.round(pay));document.getElementById('cs'+id).textContent=(pay/1725000*100).toFixed(1).replace('.',',')+'%'}
 if(el.dataset.in=='pay'){s[el.dataset.k]=el.value}
 save()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeSheet()});
const fit=()=>document.getElementById('app').style.setProperty('--k',Math.min(1,(innerHeight-32)/844));
addEventListener('resize',fit);fit();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(st.theme=='system')render()})}catch(e){}
render();
</script>
</body>
</html>
